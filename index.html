<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorry Bestie 🥺💙</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #c9d6ff, #e2e2e2);
      font-family: "Poppins", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    .container {
      padding: 20px;
      max-width: 90%;
    }

    h1 {
      font-size: 2.2rem;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 400;
      color: #555;
    }

    .buttons {
      margin-top: 30px;
      position: relative;
      height: 160px;
    }

    button {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yesBtn {
      background: #6a11cb;
      color: white;
    }

    #noBtn {
      background: #ff4b5c;
      color: white;
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
    }

    .emoji {
      position: absolute;
      font-size: 30px;
      animation: floatUp 3s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(-300px) scale(1.6);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <audio id="bgMusic" loop>
    <source src="celebration.mp3" type="audio/mpeg">
  </audio>

  <div class="container" id="content">
    <h1>Bestieeee 🥺👉👈</h1>
    <h2>
      I messed up.  
      Please don’t stay mad 😭  
      <br><br>
      Will you forgive me?
    </h2>

    <div class="buttons">
      <button id="yesBtn">Yes 💙</button>
      <button id="noBtn">No 😤</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const music = document.getElementById("bgMusic");

    function vibrate(pattern = 50) {
      if (navigator.vibrate) {
        navigator.vibrate(pattern);
      }
    }

    function escapeNoButton() {
      vibrate([30, 20, 30]);
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;
      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    }

    ["touchstart", "touchmove", "mouseenter", "click"].forEach(evt => {
      noBtn.addEventListener(evt, escapeNoButton);
    });

    yesBtn.addEventListener("click", () => {
      // 1️⃣ UPDATE UI FIRST (always works)
      document.getElementById("content").innerHTML = `
        <h1>YAYYYY 🥳💙</h1>
        <h2>
          Knew it 😌  
          <br><br>
          Best friends forever ♾️  
          <br><br>
          Ice cream / chai on me 🍦☕
        </h2>
      `;

      // 2️⃣ EMOJIS
      for (let i = 0; i < 60; i++) {
        createEmoji();
      }

      // 3️⃣ VIBRATION
      vibrate([100, 50, 100]);

      // 4️⃣ MUSIC (delayed = mobile-safe)
      setTimeout(() => {
        music.play().catch(() => {});
      }, 300);
    });

    function createEmoji() {
      const emojis = ["🎉","🎊","🥳","💖","💙","✨","🫶"];
      const emoji = document.createElement("div");
      emoji.className = "emoji";
      emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * window.innerWidth + "px";
      emoji.style.top = window.innerHeight + "px";
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 3000);
    }
  </script>

</body>
</html>
